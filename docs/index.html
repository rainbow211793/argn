<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Argn - Media Archive</title>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-N8SLQM5979"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());

          gtag('config', 'G-N8SLQM5979');
        </script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h1>Argn</h1>
            <p>"Distribute, Create & Save"</p>
            
            <div class="filter-section">
                <input type="text" placeholder="Search media or folders..." class="search-bar" id="searchInput">
                
                <div class="category-filter">
                    <label for="categorySelect">Filter by Category:</label>
                    <select id="categorySelect" class="category-select">
                        <option value="">All Categories</option>
                    </select>
                </div>
            </div>

            <div id="folderScroll" class="folder-scroll-container">
                <div class="folder-card all-folders-card active" onclick="filterByFolder('')">
                    <div class="folder-icon" style="background-color: #3a5a7a;">📂</div>
                    <div class="folder-name">All</div>
                </div>
            </div>
            
            <div id="mediaContainer" class="media-container"></div>
            <div id="mediaDetail" class="media-detail hidden"></div>
        </div>
        
        <script src="./script.js"></script>
    </body>
</html>
